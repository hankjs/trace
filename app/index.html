<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e1e5ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="App" />
    <link rel="icon" href="/app/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/app/favicon.png" />
    <title>App</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      ;(function () {
        var mode = localStorage.getItem('app-theme')
        var dark =
          mode === 'dark' ||
          (mode !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#262a33' : '#e1e5ec')
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

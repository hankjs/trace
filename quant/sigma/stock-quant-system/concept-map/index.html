<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票量化学习概念图</title>
    <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.css">
    <script>
      window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import React from "https://esm.sh/react@19.0.0";
      import { createRoot } from "https://esm.sh/react-dom@19.0.0/client";
      import * as ExcalidrawLib from "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.js?external=react,react-dom";

      const { Excalidraw, convertToExcalidrawElements } = ExcalidrawLib;
      const box = (x, y, text, fill, stroke, active = false) => [
        { type: "rectangle", x, y, width: 230, height: 72, backgroundColor: fill, strokeColor: stroke, fillStyle: "solid", strokeWidth: active ? 4 : 2, roughness: 1, roundness: { type: 3 } },
        { type: "text", x: x + 16, y: y + 24, width: 198, text, fontSize: 18, fontFamily: 1, textAlign: "center", strokeColor: "#1f2937" }
      ];
      const arrow = (x, y, width, height = 0) => ({ type: "arrow", x, y, width, height, strokeColor: "#6b7280", strokeWidth: 2, roughness: 1 });

      const elementsData = [
        { type: "text", x: 390, y: 24, width: 560, text: "日频量化研究与人工决策", fontSize: 34, fontFamily: 1, textAlign: "center", strokeColor: "#111827" },
        { type: "text", x: 70, y: 116, width: 230, text: "基础语言", fontSize: 22, fontFamily: 1, textAlign: "center", strokeColor: "#0c8599" },
        { type: "text", x: 380, y: 116, width: 230, text: "研究材料", fontSize: 22, fontFamily: 1, textAlign: "center", strokeColor: "#2f9e44" },
        { type: "text", x: 690, y: 116, width: 230, text: "验证策略", fontSize: 22, fontFamily: 1, textAlign: "center", strokeColor: "#e8590c" },
        { type: "text", x: 1000, y: 116, width: 230, text: "形成决策", fontSize: 22, fontFamily: 1, textAlign: "center", strokeColor: "#e03131" },

        ...box(70, 170, "收益、亏损与最大回撤", "#b2f2bb", "#2f9e44"),
        ...box(70, 282, "股票、基金与指数", "#b2f2bb", "#2f9e44"),
        ...box(70, 394, "日线、成交量与复权", "#b2f2bb", "#2f9e44"),

        ...box(380, 170, "三张财务报表", "#b2f2bb", "#2f9e44"),
        ...box(380, 282, "PE、PB、ROE 与质量", "#b2f2bb", "#2f9e44"),
        ...box(380, 394, "数据质量与未来数据偏差", "#b2f2bb", "#2f9e44"),

        ...box(690, 170, "收益、波动、夏普与基准", "#b2f2bb", "#2f9e44"),
        ...box(690, 282, "股票池、因子与信号", "#b2f2bb", "#2f9e44"),
        ...box(690, 394, "回测假设与可信度", "#b2f2bb", "#2f9e44"),

        ...box(1000, 226, "组合、分散与仓位", "#b2f2bb", "#2f9e44"),
        ...box(1000, 338, "日常研究与人工决策", "#b2f2bb", "#2f9e44"),

        arrow(300, 206, 80),
        arrow(300, 318, 80),
        arrow(300, 430, 80),
        arrow(610, 206, 80),
        arrow(610, 318, 80),
        arrow(610, 430, 80),
        arrow(920, 206, 80, 56),
        arrow(920, 318, 80, 56),
        arrow(920, 430, 80, -56),
        arrow(1115, 298, 0, 40)
      ];

      const elements = convertToExcalidrawElements(elementsData);
      function App() {
        return React.createElement("div", { style: { height: "100%", width: "100%" } }, React.createElement(Excalidraw, {
          initialData: { elements, appState: { viewBackgroundColor: "#f8fafc" } },
          scrollToContent: true,
          langCode: "zh-CN"
        }));
      }
      createRoot(document.getElementById("app")).render(React.createElement(App));
    </script>
  </body>
</html>

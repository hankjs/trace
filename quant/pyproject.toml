[project]
name = "quant"
version = "0.1.0"
description = "A股日频量化信息系统(纯信息系统,不做自动交易)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "baostock>=0.8.8",
    "akshare>=1.14",
    "apscheduler>=3.10,<4",
    "pydantic>=2.0",
    "vectorbt>=1.1",
]

[tool.uv]
package = false

# 固定走阿里云 PyPI 镜像:uv.lock 会记录该镜像的文件 URL,
# 服务器 sync 时直接从镜像下载(默认 pypi.org 在国内服务器上极慢)
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

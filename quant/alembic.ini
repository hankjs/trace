# Alembic 配置。数据库 URL 不写在这里:
# env.py 优先取 `-x db_url=...`,否则取 app.config.settings.database_url。
# 这样生产连接串只存在于 config.toml(gitignore),不进版本库。
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 文件名带日期前缀,便于按时间排序阅读
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

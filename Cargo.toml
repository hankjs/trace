[workspace]
members = [
    "server",
    "crates/hank-provider",
    "crates/code-agent",
    "crates/code-tools",
    "crates/hank-db",
    "crates/hank-a2a-client",
]
exclude = ["client/src-tauri", "cli"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "uuid"] }
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
jsonwebtoken = "9"
tokio-stream = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
bcrypt = "0.16"
# 终端截图(需求 A):SGR 快照 -> SVG -> PNG
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
fontdb = "0.23"
unicode-width = "0.2"
# 网页截图(需求 B):headless Chrome DevTools 协议
chromiumoxide = "0.7"
# 飞书渠道:WS 长连接(pbbp2 protobuf 帧)+ REST API(手写,对齐 weixin 模块风格)
tokio-tungstenite = "0.24"
prost = "0.13"
# 定时任务调度(cron 解析 + 上海时区)
cron = "0.15"
chrono-tz = "0.10"

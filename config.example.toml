# Hank Agent 配置文件
# 复制为 config.toml 并填入你的配置

[server]
host = "0.0.0.0"
port = 3000
jwt_secret = "change-me-to-a-random-string"
database_url = "mysql://user:password@host:3306/dbname"

# Chrome/Chromium 可执行文件路径（微信 /snap 网页截图用，服务器需先安装 chromium）
# 留空时自动探测常见路径，也可用 CHROME_PATH 环境变量指定
# chrome_path = "/usr/bin/chromium"

# admin 后台外部可访问地址，用于飞书确认卡片生成交互单详情深链。
# admin 是 history 路由，base path `/admin/`（见 admin/src/main.ts）。
# 留空则卡片不渲染深链行。示例：admin_base_url = "https://your-host"
# 深链格式：{admin_base_url}/admin/interactions/{id}
# admin_base_url = "https://your-host"

# 多实例共库时只能一个实例开启长连接 / 调度（默认均为 true）
# weixin_monitor = true
# feishu_monitor = true
# scheduler_enabled = true

# 飞书驱动的 server 侧原生会话（默认关闭）。
# 开启后，绑定到 can_login_admin 用户的飞书新话题会建 server 侧会话。
# 只有这一个开关：worktree / 沙箱 / 降权执行用户 / 部署 helper / 任务闸门都已随
# 代码 Agent 执行链路下线，server 会话只有对话与 server 本地工具，不建工作区目录。
[server_agent]
enabled = false

[quant_a2a]
# 是否在所有已登录会话注册 quant_* 工具（默认 false）。
# 开启后每个会话都会挂载 19 个 quant 工具 schema 并向系统提示注入 quant-research skill。
# 同时：飞书路由才会产出 quant_research 话题类型（关闭时飞书与现在行为一致，无该类型）。
enabled = false
# quant A2A Server 根地址（也可直接填 .../a2a）；省略时默认 http://127.0.0.1:8100
base_url = "http://127.0.0.1:8100"

# 飞书渠道：应用凭证不走配置文件，由 admin REST 管理（见 docs/feishu.md）：
#   POST /api/admin/feishu/accounts  {name, app_id, app_secret}
# 多实例共库时只能一个实例开 WS 长连接（在 [server] 里设 feishu_monitor = false 可关）

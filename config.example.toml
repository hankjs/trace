# Hank Agent 配置文件
# 复制为 config.toml 并填入你的配置

[server]
host = "0.0.0.0"
port = 3000
jwt_secret = "change-me-to-a-random-string"
database_url = "mysql://user:password@host:3306/dbname"

# Chrome/Chromium 可执行文件路径（微信 /snap 网页截图用，服务器需先安装 chromium）
# 留空时自动探测常见路径，也可用 CHROME_PATH 环境变量指定
# chrome_path = "/usr/bin/chromium"

# 飞书驱动的 server-only monorepo Agent（默认关闭）。
# 开启后，绑定到 can_login_admin 用户的飞书新话题会先判断任务归属：
# Trace/quant 任务创建 Git worktree，其他任务创建普通隔离目录，命令和问询不建目录。
# 仓库任务可迭代 server/crates/admin/cli/quant/docs，但 client/ 永远拒绝部署。
[server_agent]
enabled = false
repository_root = "/opt/hank-src"
worktrees_root = "/opt/hank-worktrees"
general_workspaces_root = "/opt/hank-workspaces"
base_ref = "trace-production"
deploy_jobs_dir = "/opt/hank/deploy-jobs"
deploy_helper = "/usr/local/libexec/hank-deploy"
execution_user = "hank-build"
agent_cli_root = "/opt/hank-agent-cli"
agent_state_root = "/opt/hank-agent-state"
agent_timeout_secs = 1800
agent_output_limit_bytes = 2097152
agent_sandbox_bin = "/usr/bin/bwrap"
deploy_use_sudo = true
approval_ttl_secs = 600

[quant_a2a]
# 是否在所有已登录会话注册 quant_* 工具（默认 false）。
# 开启后每个会话都会挂载 19 个 quant 工具 schema 并向系统提示注入 quant-research skill。
enabled = false
# quant A2A Server 地址；留空或省略时默认 http://127.0.0.1:8100
base_url = "http://127.0.0.1:8100"

# 飞书渠道：应用凭证不走配置文件，由 admin REST 管理（见 docs/feishu.md）：
#   POST /api/admin/feishu/accounts  {name, app_id, app_secret}
# 多实例共库时只能一个实例开 WS 长连接（在 [server] 里设 feishu_monitor = false 可关）
